<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#02030a">
<title>Simulasi Interaktif Tata Surya & Gerhana 3D</title>
<style>
:root{
  --bg:#02030a; --panel:rgba(10,14,36,.68); --panel-b:rgba(120,150,255,.22);
  --txt:#e8eeff; --mut:#9aa8d6; --acc:#5de0ff; --acc2:#8b7bff; --warn:#ffcf5d; --ok:#5dffb0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.glass{background:var(--panel);border:1px solid var(--panel-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px}

/* LOADER */
#loader{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#0b1030,#02030a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .7s;text-align:center;padding:24px}
#loader.hide{opacity:0;pointer-events:none}
.ld-spin{width:64px;height:64px;border-radius:50%;border:4px solid rgba(93,224,255,.15);border-top-color:var(--acc);animation:rot 1s linear infinite}
.ld-text{color:var(--mut);font-size:15px;line-height:1.5}
@keyframes rot{to{transform:rotate(360deg)}}

/* NAVBAR */
#navbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:linear-gradient(180deg,rgba(4,6,20,.92),rgba(4,6,20,.55));border-bottom:1px solid var(--panel-b);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px;white-space:nowrap;font-size:17px}
.brand b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.modes{display:flex;gap:6px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mode{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid transparent;color:var(--mut);transition:.2s}
.mode:hover{color:#fff;background:rgba(255,255,255,.07)}
.mode.active{color:#fff;background:linear-gradient(135deg,rgba(93,224,255,.28),rgba(139,123,255,.32));border-color:rgba(140,170,255,.5);box-shadow:0 0 18px rgba(93,224,255,.25)}
.tools{display:flex;gap:6px}
.tbtn{padding:8px 12px;border-radius:12px;font-size:13px;color:var(--mut);border:1px solid var(--panel-b);background:rgba(255,255,255,.04);white-space:nowrap}
.tbtn:hover{color:#fff;background:rgba(255,255,255,.1)}

/* CHIPS */
#chips{position:fixed;top:64px;left:10px;right:10px;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;
  background:rgba(10,14,36,.62);border:1px solid var(--panel-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#dfe7ff;transition:.15s}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
.chip:hover{background:rgba(93,224,255,.16)}
.chip.on{border-color:var(--acc);background:rgba(93,224,255,.22);box-shadow:0 0 14px rgba(93,224,255,.3)}

/* LABELS */
#labels{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;pointer-events:auto;cursor:pointer;white-space:nowrap;
  background:rgba(6,10,30,.6);border:1px solid rgba(140,170,255,.28);color:#e6edff;text-shadow:0 1px 3px #000;will-change:transform}
.lbl:hover{background:rgba(93,224,255,.3)}

/* BOTTOM PANELS */
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:25;width:min(980px,calc(100vw - 20px));padding:12px 16px}
#solarBar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pbtn{width:44px;height:44px;border-radius:50%;font-size:18px;background:linear-gradient(135deg,rgba(93,224,255,.3),rgba(139,123,255,.35));border:1px solid rgba(140,170,255,.5);flex:none}
.pbtn:hover{filter:brightness(1.25)}
.speed{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.speed b{color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(90deg,rgba(93,224,255,.5),rgba(139,123,255,.5));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--acc);box-shadow:0 0 12px var(--acc);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--acc);cursor:pointer}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);cursor:pointer;user-select:none;white-space:nowrap}
.chk input{accent-color:var(--acc);width:16px;height:16px}
.hint{flex-basis:100%;font-size:12px;color:#7f8cb8;line-height:1.4}

/* ECLIPSE PANEL */
#eclPanel{display:none}
body:not([data-mode="solar"]) #eclPanel{display:block}
body[data-mode="solar"] #eclPanel{display:none}
body:not([data-mode="solar"]) #solarBar,body:not([data-mode="solar"]) #chips{display:none}
.ecl-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
#eclTitle{font-size:18px;margin-bottom:4px}
#eclDesc{font-size:13px;line-height:1.5;color:#cdd7f7}
#eclDesc b{color:var(--acc)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.facts span{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(139,123,255,.2);border:1px solid rgba(139,123,255,.4)}
.status{font-size:14px;font-weight:700;padding:9px 12px;border-radius:12px;border:1px solid;margin-top:6px;line-height:1.35}
.status.ok{color:var(--ok);background:rgba(93,255,176,.1);border-color:rgba(93,255,176,.45)}
.status.no{color:var(--mut);background:rgba(255,255,255,.04);border-color:var(--panel-b)}
.ecl-ctrl label.l{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
.ecl-ctrl label.l b{color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.sbtn{padding:7px 12px;font-size:13px;font-weight:600;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--panel-b)}
.sbtn:hover{background:rgba(93,224,255,.2)}
.sbtn.pri{background:linear-gradient(135deg,rgba(93,224,255,.3),rgba(139,123,255,.35));border-color:rgba(140,170,255,.5)}
.sbtn.on{border-color:var(--acc);background:rgba(93,224,255,.25)}
.warn{font-size:12px;color:var(--warn);margin-top:8px;line-height:1.4}

/* MODAL */
#modal{position:fixed;z-index:40;right:16px;top:112px;width:min(410px,calc(100vw - 24px));max-height:calc(100vh - 200px);overflow-y:auto;
  padding:18px;opacity:0;pointer-events:none;transform:translateX(30px) scale(.97);transition:.35s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(93,224,255,.12)}
#modal.show{opacity:1;pointer-events:auto;transform:none}
#modal::-webkit-scrollbar{width:6px}#modal::-webkit-scrollbar-thumb{background:rgba(140,170,255,.35);border-radius:9px}
.mclose{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);font-size:15px;z-index:3}
.mclose:hover{background:rgba(255,90,110,.45)}
.m-preview{display:flex;align-items:center;justify-content:center;height:210px;margin:-4px -4px 12px;border-radius:12px;background:radial-gradient(circle at 50% 50%,rgba(40,60,140,.35),rgba(2,4,14,.9));overflow:hidden;position:relative}
#mName{font-size:26px;line-height:1.1}
.tag{display:inline-block;margin:6px 0 8px;font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(93,224,255,.16);border:1px solid rgba(93,224,255,.45);color:var(--acc);font-weight:600}
#mDesc{font-size:14px;line-height:1.55;color:#d3dcf8;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(140,170,255,.16)}
.stat small{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.stat span{font-size:13px;font-weight:600;line-height:1.35;display:block}
.fact{margin-top:12px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(255,207,93,.14),rgba(255,140,60,.1));border:1px solid rgba(255,207,93,.4);font-size:13.5px;line-height:1.5}
.fact b{color:var(--warn)}
.fact p{margin-top:4px;color:#ffeccc}
/* preview sphere */
.pv{position:relative;width:170px;height:170px}
.sphere{position:absolute;inset:0;border-radius:50%;background-size:340px 170px;background-repeat:repeat-x;animation:pvspin 26s linear infinite;
  box-shadow:inset -34px -12px 50px rgba(0,0,0,.88),inset 7px 5px 18px rgba(255,255,255,.14),0 0 38px rgba(110,160,255,.3)}
.sphere.sun{box-shadow:inset 0 0 30px rgba(255,200,80,.6),0 0 60px 14px rgba(255,150,40,.55);animation-duration:60s}
@keyframes pvspin{from{background-position:0 0}to{background-position:-340px 0}}
.rings{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(-16deg)}
.rings i{position:absolute;left:-150px;top:-34px;width:300px;height:68px;border-radius:50%;border:12px solid rgba(225,205,160,.62);box-shadow:0 0 0 3px rgba(190,165,120,.35)}
.rings.back{z-index:0}.rings.back i{clip-path:inset(0 0 50% 0)}
.rings.front{z-index:2}.rings.front i{clip-path:inset(50% 0 0 0)}
.sphere{z-index:1}
.flat{position:absolute;inset:0;background-size:cover;background-position:center}

/* responsive */
@media(max-width:820px){
  .brand span{display:none}
  .ecl-grid{grid-template-columns:1fr;gap:8px}
  .panel{padding:10px 12px;bottom:8px}
  #eclDesc,.facts{display:none}
  #eclTitle{font-size:15px}
  #modal{top:104px;max-height:46vh;right:50%;transform:translateX(50%) translateY(20px)}
  #modal.show{transform:translateX(50%)}
  .m-preview{height:170px}
  .tbtn.hide-m{display:none}
}
</style>
</head>
<body data-mode="solar">

<div id="loader"><div class="ld-spin"></div><div class="ld-text">Menyiapkan alam semesta…<br><small>Membuat tekstur planet 3D</small></div></div>

<nav id="navbar">
  <div class="brand">🪐 <span>Tata Surya <b>3D</b></span></div>
  <div class="modes">
    <button class="mode active" data-mode="solar">☀️ Tata Surya</button>
    <button class="mode" data-mode="solarEclipse">🌑 Gerhana Matahari</button>
    <button class="mode" data-mode="lunarEclipse">🌕 Gerhana Bulan</button>
  </div>
  <div class="tools">
    <button class="tbtn" id="btnReset" title="Kembali ke tampilan awal">Tampilan Awal</button>
    <button class="tbtn hide-m" id="btnFull" title="Layar penuh">⛶</button>
  </div>
</nav>

<div id="chips"></div>
<div id="stage"></div>
<div id="labels"></div>

<!-- Bar kontrol mode Tata Surya -->
<section id="solarBar" class="panel glass">
  <button class="pbtn" id="btnPlay" title="Jeda / Putar">⏸</button>
  <div class="speed">
    <span>Kecepatan waktu: <b id="speedTxt">1.0×</b></span>
    <input type="range" id="speed" min="0" max="10" step="0.1" value="1">
  </div>
  <label class="chk"><input type="checkbox" id="chkOrbit" checked> Garis orbit</label>
  <label class="chk"><input type="checkbox" id="chkLabel" checked> Nama benda</label>
  
</section>

<!-- Panel mode Gerhana -->
<section id="eclPanel" class="panel glass">
  <div class="ecl-grid">
    <div>
      <h3 id="eclTitle"></h3>
      <p id="eclDesc"></p>
      <div class="facts" id="eclFacts"></div>
      <div class="status no" id="eclStatus"></div>
    </div>
    <div class="ecl-ctrl">
      <label class="l">Posisi Bulan: <b id="phiTxt">70°</b> · Fase: <b id="phaseTxt"></b></label>
      <input type="range" id="phi" min="0" max="360" step="0.5" value="70">
      <div class="btns">
        <button class="sbtn pri" id="eclAlign">Posisi Gerhana</button>
        <button class="sbtn" id="eclAuto">▶ Putar Otomatis</button>
        <label class="chk"><input type="checkbox" id="chkTilt"> Orbit Bulan miring</label>
        <label class="chk"><input type="checkbox" id="chkShadow" checked> Bayangan</label>
      </div>
      <div class="btns" id="viewBtns">
        <button class="sbtn on" data-view="near">Dekat</button>
        <button class="sbtn" data-view="all">Seluruh</button>
        <button class="sbtn" data-view="top">Atas</button>
        <button class="sbtn" data-view="obs">Pengamat</button>
      </div>
    </div>
  </div>
  <p class="warn">⚠️ Jangan pernah menatap Matahari langsung (termasuk saat gerhana) tanpa kacamata gerhana khusus. Ukuran &amp; jarak tidak sesuai skala.</p>
</section>

<!-- Popup informasi benda langit -->
<aside id="modal" class="glass" aria-hidden="true" role="dialog">
  <button class="mclose" id="mClose" aria-label="Tutup">✕</button>
  <div class="m-preview" id="mPreview"></div>
  <h2 id="mName"></h2>
  <span class="tag" id="mType"></span>
  <p id="mDesc"></p>
  <div class="stats" id="mStats"></div>
  <div class="fact"><b>💡 Tahukah kamu?</b><p id="mFact"></p></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

/* =====================================================================
   2. GENERATOR TEKSTUR PROSEDURAL (noise 3D → tidak ada sambungan/seam)
   ===================================================================== */
function ihash(x,y,z){
  let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1274126177);
  h=Math.imul(h^(h>>>13),1103515245); h^=h>>>16;
  return (h>>>0)/4294967296;
}
function vnoise(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  let xf=x-xi,yf=y-yi,zf=z-zi;
  xf=xf*xf*(3-2*xf); yf=yf*yf*(3-2*yf); zf=zf*zf*(3-2*zf);
  const a=ihash(xi,yi,zi),b=ihash(xi+1,yi,zi),c=ihash(xi,yi+1,zi),d=ihash(xi+1,yi+1,zi);
  const e=ihash(xi,yi,zi+1),f=ihash(xi+1,yi,zi+1),g=ihash(xi,yi+1,zi+1),h=ihash(xi+1,yi+1,zi+1);
  const x1=a+(b-a)*xf,x2=c+(d-c)*xf,x3=e+(f-e)*xf,x4=g+(h-g)*xf;
  const y1=x1+(x2-x1)*yf,y2=x3+(x4-x3)*yf;
  return y1+(y2-y1)*zf;
}
function fbm(x,y,z,o){
  o=o||5; let s=0,a=0.5,f=1,n=0;
  for(let i=0;i<o;i++){ s+=a*vnoise(x*f+i*17.3,y*f+i*9.1,z*f+i*4.7); n+=a; f*=2; a*=0.5; }
  return s/n;
}
function rng(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

function makeCanvasTex(w,h,fn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); const img=ctx.createImageData(w,h); const d=img.data; const o=[0,0,0,255];
  for(let y=0;y<h;y++){
    const lat=(0.5-(y+0.5)/h)*Math.PI, cl=Math.cos(lat), py=Math.sin(lat);
    for(let x=0;x<w;x++){
      const lon=(x+0.5)/w*TAU, px=cl*Math.cos(lon), pz=cl*Math.sin(lon);
      o[3]=255; fn(px,py,pz,lat,lon,o);
      const i=(y*w+x)*4; d[i]=o[0]; d[i+1]=o[1]; d[i+2]=o[2]; d[i+3]=o[3];
    }
  }
  ctx.putImageData(img,0,0);
  return c;
}
function addCraters(c,count,seed,minR,maxR){
  const ctx=c.getContext('2d'),w=c.width,h=c.height,r=rng(seed);
  for(let i=0;i<count;i++){
    const lat=Math.asin(r()*2-1)*0.94;
    const x=r()*w, y=(0.5-lat/Math.PI)*h;
    const rad=minR+Math.pow(r(),3)*(maxR-minR);
    const sx=Math.min(4,1/Math.max(0.25,Math.cos(lat)));
    for(const off of [-w,0,w]){
      ctx.save(); ctx.translate(x+off,y); ctx.scale(sx,1);
      const g=ctx.createRadialGradient(0,0,rad*0.1,0,0,rad);
      g.addColorStop(0,'rgba(25,24,24,0.42)');
      g.addColorStop(0.68,'rgba(40,38,38,0.22)');
      g.addColorStop(0.88,'rgba(240,235,228,0.32)');
      g.addColorStop(1,'rgba(240,235,228,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rad,0,TAU); ctx.fill(); ctx.restore();
    }
  }
}
function radialCanvas(size,stops){
  const c=document.createElement('canvas'); c.width=c.height=size; const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  stops.forEach(s=>g.addColorStop(s[0],s[1]));
  ctx.fillStyle=g; ctx.fillRect(0,0,size,size); return c;
}

/* ---- tekstur per benda langit ---- */
function texSun(){
  return makeCanvasTex(1024,512,(x,y,z,lat,lon,o)=>{
    const n=fbm(x*4,y*4,z*4,5), m=fbm(x*16+5,y*16,z*16,3);
    let t=clamp((n*0.7+m*0.3-0.35)*2.3,0,1);
    o[0]=255; o[1]=lerp(95,228,t); o[2]=lerp(0,95,t*t);
  });
}
function texMercury(){
  const c=makeCanvasTex(768,384,(x,y,z,lat,lon,o)=>{
    const n=fbm(x*5,y*5,z*5,5), m=fbm(x*22,y*22,z*22,2);
    const v=88+n*90+m*22; o[0]=v*1.04; o[1]=v; o[2]=v*0.94;
  });
  addCraters(c,420,11,2,22); return c;
}
function texVenus(){
  return makeCanvasTex(768,384,(x,y,z,lat,lon,o)=>{
    const w=fbm(x*2.5,y*2.5,z*2.5,4);
    const n=fbm(x*3+w*2.4,y*5+w*2.4,z*3+w*2.4,5);
    const band=Math.sin(lat*9+w*6)*0.5+0.5;
    const t=clamp(n*0.6+band*0.4,0,1);
    o[0]=lerp(200,252,t); o[1]=lerp(152,226,t); o[2]=lerp(88,158,t);
  });
}
function texEarth(){
  const SEA=0.54;
  return makeCanvasTex(1024,512,(x,y,z,lat,lon,o)=>{
    const h=fbm(x*1.8+3.1,y*1.8,z*1.8,6), al=Math.abs(lat);
    let r,g,b;
    if(h<SEA){
      const t=clamp((SEA-h)/0.2,0,1);
      r=lerp(32,5,t); g=lerp(120,32,t); b=lerp(182,92,t);
    }else{
      const e=(h-SEA)/0.16, dry=fbm(x*3+9,y*3,z*3,3);
      r=46; g=118; b=48;
      const ds=clamp((dry-0.48)*6,0,1)*(1-clamp(Math.abs(al-0.45)/0.35,0,1));
      r=lerp(r,210,ds); g=lerp(g,178,ds); b=lerp(b,112,ds);
      const hi=clamp((e-0.4)*2.4,0,1);
      r=lerp(r,118,hi); g=lerp(g,100,hi); b=lerp(b,80,hi);
      const sn=clamp((e-0.95)*6,0,1);
      r=lerp(r,246,sn); g=lerp(g,248,sn); b=lerp(b,252,sn);
    }
    const ice=clamp((al-(1.27+(fbm(x*6,y*6,z*6,3)-0.5)*0.3))*28,0,1);
    r=lerp(r,242,ice); g=lerp(g,246,ice); b=lerp(b,252,ice);
    o[0]=r; o[1]=g; o[2]=b;
  });
}
function texClouds(){
  return makeCanvasTex(1024,512,(x,y,z,lat,lon,o)=>{
    const n=fbm(x*3+20,y*3+4,z*3,5), a=clamp((n-0.5)*3.4,0,1);
    o[0]=255; o[1]=255; o[2]=255; o[3]=a*215;
  });
}
function texMoon(){
  const c=makeCanvasTex(768,384,(x,y,z,lat,lon,o)=>{
    const n=fbm(x*3,y*3,z*3,5), mare=fbm(x*1.6+7,y*1.6,z*1.6,3);
    let v=128+n*85;
    if(mare>0.54){ const t=clamp((mare-0.54)*7,0,1); v=lerp(v,66+n*44,t); }
    o[0]=v; o[1]=v; o[2]=v*1.02;
  });
  addCraters(c,340,23,2,20); return c;
}
function texMars(){
  return makeCanvasTex(768,384,(x,y,z,lat,lon,o)=>{
    const n=fbm(x*3.5,y*3.5,z*3.5,5), d=fbm(x*1.5+4,y*1.5,z*1.5,4), f=fbm(x*14,y*14,z*14,2);
    const k=0.72+n*0.5+(f-0.5)*0.2;
    let r=188*k,g=96*k,b=56*k;
    if(d>0.54){ const t=clamp((d-0.54)*6,0,1); r=lerp(r,92,t); g=lerp(g,54,t); b=lerp(b,40,t); }
    const ice=clamp((Math.abs(lat)-1.36)*30,0,1);
    r=lerp(r,244,ice); g=lerp(g,240,ice); b=lerp(b,238,ice);
    o[0]=r; o[1]=g; o[2]=b;
  });
}
function texJupiter(){
  return makeCanvasTex(1024,512,(x,y,z,lat,lon,o)=>{
    const turb=fbm(x*3+1,y*9,z*3,5), warp=(turb-0.5)*0.4;
    const b1=Math.sin((lat+warp)*16)*0.5+0.5, b2=Math.sin((lat+warp*1.5)*37+1.3)*0.5+0.5;
    const t=b1*0.65+b2*0.35;
    let r=lerp(240,170,t), g=lerp(222,110,t), b=lerp(192,68,t);
    const fine=(fbm(x*10,y*36,z*10,3)-0.5)*55; r+=fine; g+=fine; b+=fine;
    // Bintik Merah Besar
    const lat0=-0.38, lon0=3.6; let dl=lon-lon0;
    if(dl>Math.PI)dl-=TAU; if(dl<-Math.PI)dl+=TAU;
    const dx=dl*Math.cos(lat0)/0.2, dy=(lat-lat0)/0.095, d2=dx*dx+dy*dy;
    if(d2<2.4){
      const halo=smooth(2.4,1.0,d2)*0.5; r=lerp(r,238,halo); g=lerp(g,214,halo); b=lerp(b,182,halo);
      const sw=fbm(x*14,y*14,z*14,3), s=smooth(1.0,0.55,d2);
      r=lerp(r,198+sw*26,s); g=lerp(g,72+sw*34,s); b=lerp(b,48,s);
    }
    o[0]=r; o[1]=g; o[2]=b;
  });
}
function texSaturn(){
  return makeCanvasTex(768,384,(x,y,z,lat,lon,o)=>{
    const turb=fbm(x*3,y*8,z*3,4);
    const band=Math.sin(lat*20+turb*2.5)*0.5+0.5, fine=(fbm(x*8,y*30,z*8,3)-0.5)*26;
    let r=lerp(228,196,band)+fine, g=lerp(204,166,band)+fine, b=lerp(152,112,band)+fine;
    const pol=clamp((Math.abs(lat)-1.15)*3,0,1);
    r=lerp(r,150,pol*0.5); g=lerp(g,155,pol*0.5); b=lerp(b,140,pol*0.5);
    o[0]=r; o[1]=g; o[2]=b;
  });
}
function texUranus(){
  return makeCanvasTex(512,256,(x,y,z,lat,lon,o)=>{
    const n=fbm(x*3,y*6,z*3,4), band=Math.sin(lat*10)*0.5+0.5;
    const k=0.9+n*0.12+band*0.05;
    o[0]=150*k; o[1]=222*k; o[2]=230*k;
  });
}
function texNeptune(){
  return makeCanvasTex(768,384,(x,y,z,lat,lon,o)=>{
    const turb=fbm(x*3,y*8,z*3,4), band=Math.sin(lat*12+turb*2)*0.5+0.5;
    let r=lerp(34,58,band), g=lerp(66,104,band), b=lerp(200,236,band);
    const f=fbm(x*3+11,y*14,z*3,4);
    const cloud=clamp((f-0.62)*7,0,1); r=lerp(r,235,cloud*0.75); g=lerp(g,240,cloud*0.75); b=lerp(b,255,cloud*0.75);
    const lat0=-0.38, lon0=2.0; let dl=lon-lon0;
    if(dl>Math.PI)dl-=TAU; if(dl<-Math.PI)dl+=TAU;
    const dx=dl*Math.cos(lat0)/0.2, dy=(lat-lat0)/0.1, s=smooth(1.2,0.3,dx*dx+dy*dy);
    r=lerp(r,16,s); g=lerp(g,30,s); b=lerp(b,110,s);
    o[0]=r; o[1]=g; o[2]=b;
  });
}
function texRock(){
  const c=makeCanvasTex(512,256,(x,y,z,lat,lon,o)=>{
    const n=fbm(x*4,y*4,z*4,5), v=70+n*80; o[0]=v*1.08; o[1]=v*0.98; o[2]=v*0.88;
  });
  addCraters(c,120,5,2,14); return c;
}
function texNebula(){
  return makeCanvasTex(512,256,(x,y,z,lat,lon,o)=>{
    const n1=fbm(x*1.6,y*1.6,z*1.6,5), n2=fbm(x*2.4+9,y*2.4,z*2.4,4);
    const t=Math.pow(clamp((n1-0.5)*2.4,0,1),1.7), m=clamp(n2*1.4-0.2,0,1);
    o[0]=3+t*lerp(18,70,m); o[1]=4+t*lerp(40,24,m); o[2]=10+t*lerp(110,120,m);
  });
}
function texRing(){
  const w=1024,c=document.createElement('canvas'); c.width=w; c.height=8; const ctx=c.getContext('2d'); const r=rng(77);
  for(let x=0;x<w;x++){
    const u=x/w; let a=0;
    if(u<0.18) a=0;
    else if(u<0.38) a=0.28+0.1*r();
    else if(u<0.62) a=0.8+0.15*r();
    else if(u<0.68) a=0.06;
    else if(u<0.93) a=(Math.abs(u-0.86)<0.008)?0.05:0.62+0.12*r();
    else a=0;
    const tone=190+Math.round(35*Math.sin(u*80)+20*r());
    ctx.fillStyle='rgba('+tone+','+Math.round(tone*0.9)+','+Math.round(tone*0.72)+','+a.toFixed(3)+')';
    ctx.fillRect(x,0,1,8);
  }
  return c;
}

function drawBeltPreview(){
  const c=document.createElement('canvas'); c.width=420; c.height=220; const ctx=c.getContext('2d');
  ctx.fillStyle='#04061a'; ctx.fillRect(0,0,420,220); const r=rng(31);
  for(let i=0;i<70;i++){ctx.fillStyle='rgba(255,255,255,'+(0.2+r()*0.6)+')';ctx.fillRect(r()*420,r()*220,1.3,1.3);}
  for(let i=0;i<46;i++){
    const x=r()*420,y=r()*220,s=3+Math.pow(r(),2.5)*26,v=95+r()*70;
    ctx.save(); ctx.translate(x,y); ctx.rotate(r()*TAU); ctx.scale(1,0.65+r()*0.3);
    const g=ctx.createRadialGradient(-s*0.3,-s*0.3,s*0.1,0,0,s);
    g.addColorStop(0,'rgb('+(v+40)+','+(v+30)+','+(v+15)+')'); g.addColorStop(1,'rgb('+(v*0.35)+','+(v*0.32)+','+(v*0.28)+')');
    ctx.fillStyle=g; ctx.beginPath();
    for(let k=0;k<9;k++){const a=k/9*TAU,rr=s*(0.78+r()*0.3); if(k===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  return c.toDataURL('image/jpeg',0.85);
}

function makeStars(n,rMin,rMax,size,op){
  const pos=new Float32Array(n*3),col=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const u=Math.random()*2-1,th=Math.random()*TAU,s=Math.sqrt(1-u*u),r=rMin+Math.random()*(rMax-rMin);
    pos[i*3]=r*s*Math.cos(th); pos[i*3+1]=r*u; pos[i*3+2]=r*s*Math.sin(th);
    const k=0.5+Math.random()*0.5, p=Math.random();
    let cr=1,cg=1,cb=1; if(p<0.2){cr=0.7;cg=0.82;cb=1;} else if(p<0.35){cr=1;cg=0.88;cb=0.7;}
    col[i*3]=cr*k; col[i*3+1]=cg*k; col[i*3+2]=cb*k;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:size,sizeAttenuation:false,vertexColors:true,map:softDot,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending}));

function angDiff(a,b){let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;}
function setView(v){
  state.focus=null;
  cam.goalTarget.copy(v.target); cam.goalRadius=v.radius;
  cam.goalTheta=(v.theta!==undefined)?v.theta:null; cam.goalPhi=(v.phi!==undefined)?v.phi:null;
}
function applyCameraPos(){
  const sp=Math.sin(cam.phi);
  camera.position.set(cam.target.x+cam.radius*sp*Math.cos(cam.theta),cam.target.y+cam.radius*Math.cos(cam.phi),cam.target.z+cam.radius*sp*Math.sin(cam.theta));
  camera.lookAt(cam.target);
}
function updateCamera(dt){
  if(state.observer)return;
  const k=1-Math.exp(-dt*4.5);
  if(state.focus){state.focus.getWorldPosition(tmpV); cam.goalTarget.copy(tmpV);}
  cam.target.lerp(cam.goalTarget,state.focus?Math.min(1,k*1.6):k);
  if(cam.goalRadius!==null)cam.radius+=(cam.goalRadius-cam.radius)*k;
  if(cam.goalTheta!==null){cam.theta+=angDiff(cam.goalTheta,cam.theta)*k;}
  if(cam.goalPhi!==null){cam.phi+=(cam.goalPhi-cam.phi)*k;}
  applyCameraPos();
}
function zoomBy(f){cam.radius=clamp(cam.radius*f,cam.min,cam.max);cam.goalRadius=null;}

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pdist(){const a=Array.from(ptrs.values());return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
function pickAt(cx,cy){
  const r=el.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const list=state.mode==='solar'?pickSolar:pickEcl;
  const hits=ray.intersectObjects(list,false); let low=null;
  for(let i=0;i<hits.length;i++){
    const k=hits[i].object.userData.key; if(!k)continue;
    if(hits[i].object.userData.low){if(!low)low=k;continue;}
    return k;
  }
  return low;
}
el.addEventListener('pointerdown',e=>{
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)moved=0;
  if(ptrs.size===2)pinchD=pdist();
});
el.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){
    if(hoverBusy||e.pointerType==='touch')return; hoverBusy=true;
    const cx=e.clientX,cy=e.clientY;
    requestAnimationFrame(()=>{hoverBusy=false; if(!state.observer)el.style.cursor=pickAt(cx,cy)?'pointer':'grab';});
    return;
  }
  const dx=e.clientX-p.x,dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  if(state.observer)return;
  if(ptrs.size===1){
    cam.theta-=dx*0.006; cam.phi=clamp(cam.phi-dy*0.006,0.05,Math.PI-0.05);
    cam.goalTheta=null; cam.goalPhi=null;
  }else if(ptrs.size===2){
    const d=pdist(); if(pinchD>0&&d>0)zoomBy(pinchD/d); pinchD=d;
  }
});
function endPtr(e,click){
  if(click&&ptrs.size===1&&moved<7){const k=pickAt(e.clientX,e.clientY); if(k)select(k);}
  ptrs.delete(e.pointerId); if(ptrs.size<2)pinchD=0;
}

    if(b.focus){state.focus=b.focus; cam.goalRadius=b.dist; cam.goalTheta=null; cam.goalPhi=null;}
    else{state.focus=null; cam.goalTarget.copy(b.target); cam.goalRadius=b.dist; cam.goalTheta=b.theta; cam.goalPhi=b.phi;}
  }
  openModal(key);
}
$('mClose').addEventListener('click',()=>{closeModal();});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* =====================================================================
   9. UPDATE: TATA SURYA
   ===================================================================== */
function updateSolar(dt,time){
  const s=state.playing?state.speed:0, t=dt*s;
  for(let i=0;i<planets.length;i++){
    const p=planets[i];
    p.angle+=p.omega*t;
    p.pivot.position.set(Math.cos(p.angle)*p.dist,0,-Math.sin(p.angle)*p.dist);
    p.mesh.rotation.y+=p.spin*t;
    if(p.clouds)p.clouds.rotation.y+=p.spin*t*0.12;
  }
  moonAngle+=0.5*t; moonOrbit.rotation.y=moonAngle; moonSolar.rotation.y=-moonAngle;
  sunMesh.rotation.y+=0.04*t;
  const pulse=1+0.03*Math.sin(time*1.7);
  sunGlow1.scale.set(62*pulse,62*pulse,1); sunGlow2.scale.set(130*(2-pulse),130*(2-pulse),1);
  beltGroup.rotation.y+=0.012*t;
  // komet
  comet.M+=comet.n*t; cometPosition(comet.M,cometPos); cometGroup.position.copy(cometPos);
  const dist=cometPos.length(); cometDir.copy(cometPos).normalize();
  const L=clamp(3600/dist,24,125);
  for(let i=0;i<TN;i++){
    const tt=tailT[i], spread=0.3+tt*L*0.11, along=tt*L;
    tailPos[i*3]=cometDir.x*along+tailR[i*3]*spread;
    tailPos[i*3+1]=cometDir.y*along+tailR[i*3+1]*spread;
    tailPos[i*3+2]=cometDir.z*along+tailR[i*3+2]*spread;
  }
  tailGeo.attributes.position.needsUpdate=true;
  tail.material.opacity=clamp(70/dist,0.4,1);
  const cs=9+clamp(60/dist,0,1)*8; coma.scale.set(cs,cs,1);
}

/* =====================================================================
   10. UPDATE & KONTROL: GERHANA
   ===================================================================== */
const eS={phi:70,auto:false,target:null,tilt:false};
const TILT=12*DEG;
const mw=new THREE.Vector3();
let lastStatus='';
function phaseName(p){
  p=((p%360)+360)%360; const d=Math.min(p,360-p);
  if(d<12)return 'Bulan Baru'; if(d<78)return p<180?'Sabit (membesar)':'Sabit (mengecil)';
  if(d<102)return p<180?'Kuartal Pertama':'Kuartal Akhir';
  if(d<168)return p<180?'Cembung (membesar)':'Cembung (mengecil)'; return 'Purnama';
}
function updateEclipse(dt,time){
  if(eS.auto){eS.phi=(eS.phi+22*dt)%360; eS.target=null;}
  if(eS.target!==null){
    const diff=((eS.target-eS.phi+540)%360)-180;
    if(Math.abs(diff)<0.4){eS.phi=eS.target;eS.target=null;}
    else eS.phi+=Math.sign(diff)*Math.min(Math.abs(diff),70*dt);
    eS.phi=((eS.phi%360)+360)%360;
  }
  const phi=eS.phi*DEG;
  eOrbit.rotation.z=eS.tilt?TILT:0;
  eMoon.position.set(-MD*Math.cos(phi),0,MD*Math.sin(phi));
  eMoon.rotation.y=-Math.atan2(eMoon.position.z,eMoon.position.x);
  eOrbit.updateMatrixWorld(true); eMoon.getWorldPosition(mw);
  eEarth.rotation.y+=dt*0.35; eClouds.rotation.y+=dt*0.4;
  const pulse=1+0.03*Math.sin(time*1.7); eg1.scale.set(SR*5.2*pulse,SR*5.2*pulse,1);
  eSun.rotation.y+=dt*0.03;
  // bayangan Bumi pada Bulan (dihitung manual -> gerhana bulan)
  let frac=0;
  if(mw.x>0){const Ru=ER*(1-mw.x/75); const d=Math.hypot(mw.y,mw.z); frac=clamp((Ru+MR-d)/(2*MR),0,1);}
  moonMat.color.setScalar(1-0.93*frac);
  moonMat.emissive.setRGB(0.8*frac,0.2*frac,0.07*frac);
  // kerucut bayangan
  const showM=state.showShadows&&state.mode==='solarEclipse', showE=state.showShadows&&state.mode==='lunarEclipse';
  moonUmbra.visible=showM; moonPen.visible=showM; earthUmbra.visible=showE; earthPen.visible=showE;
  moonUmbra.position.set(mw.x+MD/2,mw.y,mw.z); moonPen.position.set(mw.x+15,mw.y,mw.z);
  // status
  let txt,ok=false;
  if(state.mode==='solarEclipse'){
    const d=Math.hypot(mw.y,mw.z);
    if(mw.x<0&&d<3.2){ok=true;txt='🌑 Gerhana Matahari TOTAL! Bulan tepat di antara Matahari dan Bumi — bayangan inti (umbra) Bulan jatuh ke Bumi.';}
    else if(mw.x<0&&d<ER+3.1){ok=true;txt='🌘 Gerhana Matahari SEBAGIAN — hanya bayangan tambahan (penumbra) yang mengenai Bumi.';}
    else if(mw.x>=0)txt='Bulan berada di belakang Bumi, jadi tidak ada gerhana Matahari. Coba geser Bulan ke sisi Matahari.';
    else txt='Belum terjadi gerhana. Bayangan Bulan melewati Bumi (di atas/bawah/samping). Bulan harus sejajar dengan Matahari dan Bumi.';
  }else{
    if(frac>0.97){ok=true;txt='🌕🔴 Gerhana Bulan TOTAL! Bulan seluruhnya masuk bayangan Bumi dan tampak merah gelap ("Bulan Darah").';}
    else if(frac>0.03){ok=true;txt='🌖 Gerhana Bulan SEBAGIAN — hanya sebagian Bulan yang masuk bayangan Bumi.';}
    else if(mw.x<=0)txt='Bulan berada di sisi Matahari, jadi tidak ada gerhana Bulan. Coba geser Bulan ke belakang Bumi (Purnama).';
    else txt='Belum terjadi gerhana. Bulan lolos dari bayangan Bumi. Bulan harus sejajar tepat di belakang Bumi.';
  }
  const key=txt+(ok?'1':'0');
  if(key!==lastStatus){lastStatus=key; const se=$('eclStatus'); se.textContent=txt; se.className='status '+(ok?'ok':'no');}
  $('phiTxt').textContent=Math.round(eS.phi)+'°'; $('phaseTxt').textContent=phaseName(eS.phi);
  if(document.activeElement!==$('phi'))$('phi').value=eS.phi;
  // kamera pengamat
  if(state.observer){
    if(state.mode==='solarEclipse'){camera.position.set(-ER-0.45,0,0);camera.lookAt(-40,0,0);}
    else{camera.position.set(ER+0.45,0,0);camera.lookAt(40,0,0);}
  }
}
const ECL_TEXT={
  solarEclipse:{t:'🌑 Gerhana Matahari',
    d:'Terjadi saat <b>Bulan</b> berada di antara <b>Matahari</b> dan <b>Bumi</b> pada satu garis lurus (saat Bulan Baru). Bayangan Bulan jatuh ke Bumi, sehingga Matahari tampak tertutup. Coba tekan <b>Posisi Gerhana</b>, lalu pilih <b>Pengamat</b>!',
    f:['Urutan: Matahari → Bulan → Bumi','Fase Bulan: Bulan Baru','Hanya terlihat di sebagian kecil wilayah Bumi','Berlangsung beberapa menit']},
  lunarEclipse:{t:'🌕 Gerhana Bulan',
    d:'Terjadi saat <b>Bumi</b> berada di antara <b>Matahari</b> dan <b>Bulan</b> pada satu garis lurus (saat Bulan Purnama). Bulan masuk ke bayangan Bumi dan tampak gelap kemerahan. Coba tekan <b>Posisi Gerhana</b>, lalu pilih <b>Pengamat</b>!',
    f:['Urutan: Matahari → Bumi → Bulan','Fase Bulan: Purnama','Terlihat dari seluruh sisi malam Bumi','Berlangsung beberapa jam']}
};

/* panel gerhana: event */
$('phi').addEventListener('input',e=>{eS.phi=parseFloat(e.target.value);eS.auto=false;eS.target=null;setAutoBtn();});
function setAutoBtn(){const b=$('eclAuto');b.textContent=eS.auto?'⏸ Hentikan Otomatis':'▶ Putar Otomatis';b.classList.toggle('on',eS.auto);}
$('eclAuto').addEventListener('click',()=>{eS.auto=!eS.auto;eS.target=null;setAutoBtn();});
$('eclAlign').addEventListener('click',()=>{eS.auto=false;setAutoBtn();eS.target=(state.mode==='solarEclipse')?0:180;});
$('chkTilt').addEventListener('change',e=>{eS.tilt=e.target.checked;});
$('chkShadow').addEventListener('change',e=>{state.showShadows=e.target.checked;});

const ECL_VIEWS={
  near:{target:new THREE.Vector3(-2,0,0),radius:56,theta:1.25,phi:1.12},
  all:{target:new THREE.Vector3(-72,0,0),radius:255,theta:1.45,phi:1.28},
  top:{target:new THREE.Vector3(-4,0,0),radius:62,theta:-Math.PI/2,phi:0.14}
};
function setEclView(v){
  state.eclView=v;
  document.querySelectorAll('#viewBtns .sbtn').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='obs'){
    state.observer=true; state.focus=null; camera.fov=58; camera.updateProjectionMatrix(); el.style.cursor='default';
  }else{
    if(state.observer){camera.fov=50;camera.updateProjectionMatrix();}
    state.observer=false; el.style.cursor='grab';
    cam.min=6; setView(ECL_VIEWS[v]);
  }
}
document.querySelectorAll('#viewBtns .sbtn').forEach(b=>b.addEventListener('click',()=>setEclView(b.dataset.view)));

/* =====================================================================
   11. GANTI MODE
   ===================================================================== */
function setMode(m){
  state.mode=m; document.body.dataset.mode=m;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  closeModal(); markChip(null); state.selected=null; state.focus=null;
  const isSolar=m==='solar';
  solar.visible=isSolar; ecl.visible=!isSolar;
  ambient.intensity=isSolar?0.5:0.16;
  if(state.observer){state.observer=false;camera.fov=50;camera.updateProjectionMatrix();}
  if(isSolar){
    cam.min=4; cam.target.copy(cam.goalTarget); setView(solarView); el.style.cursor='grab';
  }else{
    const tx=ECL_TEXT[m];
    $('eclTitle').textContent=tx.t; $('eclDesc').innerHTML=tx.d;
    $('eclFacts').innerHTML=tx.f.map(s=>'<span>'+s+'</span>').join('');
    eS.auto=false; eS.target=null; eS.phi=70; setAutoBtn(); lastStatus='';
    cam.min=6; setEclView('near');
  }
}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{if(state.mode!==b.dataset.mode)setMode(b.dataset.mode);}));
$('btnReset').addEventListener('click',()=>{
  closeModal(); markChip(null); state.selected=null;
  if(state.mode==='solar'){state.focus=null; cam.min=4; setView(solarView);}
  else setEclView(state.eclView==='obs'?'near':state.eclView);
});
$('btnFull').addEventListener('click',()=>{
  const d=document;
  if(!d.fullscreenElement){(d.documentElement.requestFullscreen||function(){}).call(d.documentElement);}
  else{(d.exitFullscreen||function(){}).call(d);}
});

/* kontrol bar Tata Surya */
$('btnPlay').addEventListener('click',()=>{state.playing=!state.playing;$('btnPlay').textContent=state.playing?'⏸':'▶';});
$('speed').addEventListener('input',e=>{state.speed=parseFloat(e.target.value);$('speedTxt').textContent=state.speed.toFixed(1)+'×';});
$('chkOrbit').addEventListener('change',e=>{state.showOrbits=e.target.checked;orbitLines.forEach(l=>{l.visible=state.showOrbits;});});
$('chkLabel').addEventListener('change',e=>{state.showLabels=e.target.checked;});

/* =====================================================================
   12. LABEL, RESIZE, LOOP
   ===================================================================== */
const lv=new THREE.Vector3();
function updateLabels(){
  const W=window.innerWidth,H=window.innerHeight;
  for(let i=0;i<labels.length;i++){
    const L=labels[i];
    let on=L.scope==='solar'?(state.mode==='solar'&&state.showLabels):(state.mode!=='solar'&&!state.observer);
    if(on){
      L.obj.getWorldPosition(lv); lv.y+=L.off; lv.project(camera);
      if(lv.z>1||lv.z<-1||Math.abs(lv.x)>1.1||Math.abs(lv.y)>1.1)on=false;
      else L.el.style.transform='translate('+((lv.x*0.5+0.5)*W)+'px,'+((-lv.y*0.5+0.5)*H)+'px) translate(-50%,-100%)';
    }
    if(on!==L.shown){L.shown=on;L.el.style.display=on?'block':'none';}
  }
}
function onResize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now;
  const time=now/1000;
  if(state.mode==='solar')updateSolar(dt,time); else updateEclipse(dt,time);
  updateCamera(dt);
  stars.rotation.y+=dt*0.0015;
  updateLabels();
  renderer.render(scene,camera);
}
setMode('solar');
requestAnimationFrame(frame);
loaderEl.classList.add('hide');
setTimeout(function(){loaderEl.style.display='none';},800);
}
})();
</script>
